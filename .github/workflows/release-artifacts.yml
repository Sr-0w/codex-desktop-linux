name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v2026.06.30.150000. Defaults to a UTC timestamp tag."
        required: false
        type: string
      package_version:
        description: "Native package version. Defaults to the tag without the leading v plus the short commit."
        required: false
        type: string
      upstream_dmg_url:
        description: "Codex Desktop DMG URL to package."
        required: false
        default: "https://persistent.oaistatic.com/codex-app-prod/Codex.dmg"
        type: string
      draft:
        description: "Create the GitHub Release as a draft."
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a prerelease."
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPSTREAM_DMG_PATH: /tmp/codex-upstream-ci/Codex.dmg
  RELEASE_DMG_METADATA_PATH: /tmp/codex-upstream-ci/upstream-dmg-metadata.json
  RELEASE_PATCH_REPORT_PATH: /tmp/codex-upstream-ci/patch-report.json
  DMG_CACHE_SCHEMA_VERSION: v2

jobs:
  metadata:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.release.outputs.package_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_name: ${{ steps.release.outputs.release_name }}
      upstream_dmg_url: ${{ steps.release.outputs.upstream_dmg_url }}
      draft: ${{ steps.release.outputs.draft }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PACKAGE_VERSION: ${{ inputs.package_version }}
          INPUT_UPSTREAM_DMG_URL: ${{ inputs.upstream_dmg_url }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release_tag="${GITHUB_REF_NAME}"
            draft="false"
            prerelease="false"
          else
            if [ -n "${INPUT_TAG:-}" ]; then
              release_tag="$INPUT_TAG"
            else
              release_tag="v$(date -u '+%Y.%m.%d.%H%M%S')"
            fi
            draft="${INPUT_DRAFT:-true}"
            prerelease="${INPUT_PRERELEASE:-true}"
          fi

          upstream_dmg_url="${INPUT_UPSTREAM_DMG_URL:-https://persistent.oaistatic.com/codex-app-prod/Codex.dmg}"
          short_sha="$(git rev-parse --short=12 HEAD)"
          if [ -n "${INPUT_PACKAGE_VERSION:-}" ]; then
            package_version="$INPUT_PACKAGE_VERSION"
          else
            package_version="${release_tag#v}+${short_sha}"
          fi

          case "$release_tag" in
            v*) ;;
            *) release_tag="v$release_tag" ;;
          esac

          {
            echo "release_tag=$release_tag"
            echo "package_version=$package_version"
            echo "release_name=Codex Desktop Linux $release_tag"
            echo "upstream_dmg_url=$upstream_dmg_url"
            echo "draft=$draft"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Release Metadata"
            echo ""
            echo "- Tag: \`$release_tag\`"
            echo "- Package version: \`$package_version\`"
            echo "- Upstream DMG URL: \`$upstream_dmg_url\`"
            echo "- Draft: \`$draft\`"
            echo "- Prerelease: \`$prerelease\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-app:
    name: Build Linux App From DMG (${{ matrix.build_id }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_id: x86_64
            release_arch: x86_64
            runner: ubuntu-24.04
            target_id: ""
            target_id_like: ""
            target_package_format: ""
            target_package_manager: ""
            target_desktop: ""
            target_session_type: ""
          - build_id: aarch64
            release_arch: aarch64
            runner: ubuntu-24.04-arm
            target_id: ""
            target_id_like: ""
            target_package_format: ""
            target_package_manager: ""
            target_desktop: ""
            target_session_type: ""
          - build_id: postmarketos-aarch64
            release_arch: aarch64
            runner: ubuntu-24.04-arm
            target_id: postmarketos
            target_id_like: alpine
            target_package_format: apk
            target_package_manager: apk
            target_desktop: KDE:Plasma:PlasmaMobile
            target_session_type: wayland
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            g++ \
            libarchive-tools \
            make \
            p7zip-full \
            python3 \
            tar \
            unzip \
            zstd

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Capture upstream DMG metadata
        id: upstream-metadata
        env:
          UPSTREAM_DMG_URL: ${{ needs.metadata.outputs.upstream_dmg_url }}
        run: |
          set -euo pipefail

          headers_file="$(mktemp)"
          trap 'rm -f "$headers_file"' EXIT

          appcast_version="$(
            curl -fsSL --retry 3 \
              https://persistent.oaistatic.com/codex-app-prod/appcast-x64.xml \
              | python3 -c 'import re, sys; xml=sys.stdin.read(); match=re.search(r"<sparkle:shortVersionString>([^<]+)", xml); print(match.group(1).strip() if match else "")'
          )"
          download_url="$UPSTREAM_DMG_URL"
          if [ -n "$appcast_version" ] && [ "$UPSTREAM_DMG_URL" = "https://persistent.oaistatic.com/codex-app-prod/Codex.dmg" ]; then
            download_url="${UPSTREAM_DMG_URL}?codex-linux-version=${appcast_version}"
          fi

          curl -fsSLI \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            "$download_url" > "$headers_file"
          last_modified="$(awk 'tolower($0) ~ /^last-modified:/ {sub(/\r$/,""); sub(/^[^:]+: /,""); print; exit}' "$headers_file")"
          etag="$(awk 'tolower($0) ~ /^etag:/ {sub(/\r$/,""); sub(/^[^:]+: /,""); gsub(/"/,""); print; exit}' "$headers_file")"
          content_length="$(awk 'tolower($0) ~ /^content-length:/ {sub(/\r$/,""); sub(/^[^:]+: /,""); print; exit}' "$headers_file")"

          last_modified="${last_modified:-unknown}"
          etag="${etag:-no-etag}"
          content_length="${content_length:-unknown}"
          cache_segment="$(printf '%s|%s|%s|%s\n' "$appcast_version" "$last_modified" "$etag" "$content_length" | sha256sum | cut -d' ' -f1)"

          {
            echo "appcast_version=$appcast_version"
            echo "download_url=$download_url"
            echo "last_modified=$last_modified"
            echo "etag=$etag"
            echo "content_length=$content_length"
            echo "cache_segment=$cache_segment"
          } >> "$GITHUB_OUTPUT"

      - name: Restore cached upstream DMG
        id: dmg-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.UPSTREAM_DMG_PATH }}
          key: upstream-dmg-${{ env.DMG_CACHE_SCHEMA_VERSION }}-${{ matrix.build_id }}-${{ steps.upstream-metadata.outputs.cache_segment }}

      - name: Download upstream DMG
        if: steps.dmg-cache.outputs.cache-hit != 'true'
        env:
          UPSTREAM_DMG_DOWNLOAD_URL: ${{ steps.upstream-metadata.outputs.download_url }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$UPSTREAM_DMG_PATH")"
          curl -fL --retry 3 \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            -o "$UPSTREAM_DMG_PATH" \
            "$UPSTREAM_DMG_DOWNLOAD_URL"

      - name: Record upstream DMG fingerprint
        env:
          UPSTREAM_DMG_URL: ${{ needs.metadata.outputs.upstream_dmg_url }}
          CACHE_HIT: ${{ steps.dmg-cache.outputs.cache-hit || 'false' }}
        run: |
          set -euo pipefail

          test -s "$UPSTREAM_DMG_PATH"
          dmg_sha256="$(sha256sum "$UPSTREAM_DMG_PATH" | cut -d' ' -f1)"
          dmg_size_bytes="$(stat -c '%s' "$UPSTREAM_DMG_PATH")"
          tested_at_utc="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          cat > "$RELEASE_DMG_METADATA_PATH" <<JSON
          {
            "url": "$UPSTREAM_DMG_URL",
            "download_url": "${{ steps.upstream-metadata.outputs.download_url }}",
            "appcast_version": "${{ steps.upstream-metadata.outputs.appcast_version }}",
            "path": "$UPSTREAM_DMG_PATH",
            "last_modified": "${{ steps.upstream-metadata.outputs.last_modified }}",
            "etag": "${{ steps.upstream-metadata.outputs.etag }}",
            "content_length": "${{ steps.upstream-metadata.outputs.content_length }}",
            "sha256": "$dmg_sha256",
            "size_bytes": $dmg_size_bytes,
            "tested_at_utc": "$tested_at_utc",
            "cache_hit": "$CACHE_HIT"
          }
          JSON

      - name: Build app
        env:
          CODEX_PATCH_REPORT_JSON: ${{ env.RELEASE_PATCH_REPORT_PATH }}
          CODEX_BROWSER_USE_NODE_REPL_RUNTIME_URL: ${{ matrix.release_arch == 'aarch64' && vars.CODEX_BROWSER_USE_NODE_REPL_ARM64_URL || '' }}
          CODEX_BROWSER_USE_NODE_REPL_RUNTIME_SHA256: ${{ matrix.release_arch == 'aarch64' && vars.CODEX_BROWSER_USE_NODE_REPL_ARM64_SHA256 || '' }}
          CODEX_LINUX_TARGET_ID: ${{ matrix.target_id }}
          CODEX_LINUX_TARGET_ID_LIKE: ${{ matrix.target_id_like }}
          CODEX_LINUX_TARGET_PACKAGE_FORMAT: ${{ matrix.target_package_format }}
          CODEX_LINUX_TARGET_PACKAGE_MANAGER: ${{ matrix.target_package_manager }}
          CODEX_LINUX_TARGET_DESKTOP: ${{ matrix.target_desktop }}
          CODEX_LINUX_TARGET_SESSION_TYPE: ${{ matrix.target_session_type }}
        run: ./install.sh "$UPSTREAM_DMG_PATH"

      - name: Validate required patches
        run: node scripts/ci/validate-patch-report.js "$RELEASE_PATCH_REPORT_PATH" --profile upstream-build

      - name: Reject a stale DMG CDN edge
        run: |
          curl -fsSL --retry 3 -o /tmp/openai-linux-Packages \
            https://persistent.oaistatic.com/codex-app-prod/linux/deb/dists/stable/main/binary-amd64/Packages
          node scripts/ci/validate-upstream-release-version.js \
            --build-info codex-app/.codex-linux/build-info.json \
            --packages /tmp/openai-linux-Packages

      - name: Validate generated app architecture
        run: scripts/ci/validate-app-architecture.sh codex-app "${{ matrix.release_arch }}"

      - name: Record Browser Use runtime availability
        run: |
          set -euo pipefail
          if [ -x codex-app/resources/node_repl ]; then
            echo "Browser Use node_repl is available for ${{ matrix.release_arch }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Browser Use node_repl is unavailable for ${{ matrix.release_arch }}; the app and native browser bridge are packaged without the privileged JavaScript runtime."
            echo "Browser Use node_repl is unavailable for ${{ matrix.release_arch }}. Configure the repository variables CODEX_BROWSER_USE_NODE_REPL_ARM64_URL and CODEX_BROWSER_USE_NODE_REPL_ARM64_SHA256 when an official ARM64 runtime is available." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stage build metadata
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          cp "$RELEASE_DMG_METADATA_PATH" "release-metadata/upstream-dmg-metadata-${{ matrix.build_id }}.json"
          cp "$RELEASE_PATCH_REPORT_PATH" "release-metadata/patch-report-${{ matrix.build_id }}.json"
          cp codex-app/.codex-linux/build-info.json "release-metadata/build-info-${{ matrix.build_id }}.json"
          cp codex-app/.codex-linux/patch-report.json "release-metadata/installed-patch-report-${{ matrix.build_id }}.json"

      - name: Archive generated app for package jobs
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
        run: |
          set -euo pipefail
          tar -I 'zstd -T0 -19' -cf "codex-app-${PACKAGE_VERSION}-${{ matrix.build_id }}.tar.zst" codex-app release-metadata

      - name: Upload generated app
        uses: actions/upload-artifact@v4
        with:
          name: codex-app-build-${{ matrix.build_id }}
          path: codex-app-${{ needs.metadata.outputs.package_version }}-${{ matrix.build_id }}.tar.zst
          retention-days: 7

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata-${{ matrix.build_id }}
          path: release-metadata/*

  package-appimage:
    name: Build AppImage (${{ matrix.release_arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs:
      - metadata
      - build-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_arch: x86_64
            runner: ubuntu-24.04
            appimagetool_arch: x86_64
          - release_arch: aarch64
            runner: ubuntu-24.04-arm
            appimagetool_arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install AppImage tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl file zstd
          mkdir -p "$HOME/.local/bin"
          curl -fL --retry 3 \
            -o "$HOME/.local/bin/appimagetool" \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${{ matrix.appimagetool_arch }}.AppImage"
          chmod 0755 "$HOME/.local/bin/appimagetool"

      - name: Download generated app
        uses: actions/download-artifact@v4
        with:
          name: codex-app-build-${{ matrix.release_arch }}

      - name: Extract generated app
        run: tar -I zstd -xf codex-app-${{ needs.metadata.outputs.package_version }}-${{ matrix.release_arch }}.tar.zst

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
        run: |
          set -euo pipefail
          APPIMAGETOOL="$HOME/.local/bin/appimagetool" ./scripts/build-appimage.sh
          appimage_file="$(find dist -maxdepth 1 -name 'codex-desktop-*.AppImage' -print -quit)"
          test -n "$appimage_file"
          mkdir -p release-assets
          cp "$appimage_file" "release-assets/codex-desktop-linux-${{ matrix.release_arch }}.AppImage"
          (
            cd release-assets
            sha256sum "codex-desktop-linux-${{ matrix.release_arch }}.AppImage" > "codex-desktop-linux-${{ matrix.release_arch }}.AppImage.sha256"
          )

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-appimage-${{ matrix.release_arch }}
          path: release-assets/*

  package-deb:
    name: Build Debian Package (${{ matrix.deb_arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs:
      - metadata
      - build-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_arch: x86_64
            deb_arch: amd64
            runner: ubuntu-24.04
          - release_arch: aarch64
            deb_arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install package dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make zstd
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Download generated app
        uses: actions/download-artifact@v4
        with:
          name: codex-app-build-${{ matrix.release_arch }}

      - name: Extract generated app
        run: tar -I zstd -xf codex-app-${{ needs.metadata.outputs.package_version }}-${{ matrix.release_arch }}.tar.zst

      - name: Build Debian package
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
          MAX_BUILD_THREADS: "4"
        run: |
          set -euo pipefail
          cargo build --release -p codex-update-manager
          ./scripts/build-deb.sh
          deb_file="$(find dist -maxdepth 1 -name 'codex-desktop_*.deb' -print -quit)"
          test -n "$deb_file"
          test "$(dpkg-deb -f "$deb_file" Architecture)" = "${{ matrix.deb_arch }}"
          dpkg-deb -I "$deb_file"
          dpkg-deb -c "$deb_file" | tee /tmp/deb-contents.txt >/dev/null
          grep -q './usr/bin/codex-update-manager' /tmp/deb-contents.txt
          grep -q './opt/codex-desktop/update-builder/install.sh' /tmp/deb-contents.txt
          mkdir -p release-assets
          cp "$deb_file" "release-assets/codex-desktop-linux-${{ matrix.deb_arch }}.deb"
          (
            cd release-assets
            sha256sum "codex-desktop-linux-${{ matrix.deb_arch }}.deb" > "codex-desktop-linux-${{ matrix.deb_arch }}.deb.sha256"
          )

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-deb-${{ matrix.release_arch }}
          path: release-assets/*

  package-rpm:
    name: Build RPM Package (${{ matrix.rpm_arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs:
      - metadata
      - build-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_arch: x86_64
            rpm_arch: x86_64
            runner: ubuntu-24.04
          - release_arch: aarch64
            rpm_arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install package dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make rpm zstd
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Download generated app
        uses: actions/download-artifact@v4
        with:
          name: codex-app-build-${{ matrix.release_arch }}

      - name: Extract generated app
        run: tar -I zstd -xf codex-app-${{ needs.metadata.outputs.package_version }}-${{ matrix.release_arch }}.tar.zst

      - name: Build RPM package
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
          MAX_BUILD_THREADS: "4"
        run: |
          set -euo pipefail
          cargo build --release -p codex-update-manager
          ./scripts/build-rpm.sh
          rpm_file="$(find dist -maxdepth 1 -name 'codex-desktop-*.rpm' -print -quit)"
          test -n "$rpm_file"
          test "$(rpm -qp --queryformat '%{ARCH}' "$rpm_file")" = "${{ matrix.rpm_arch }}"
          rpm -qip "$rpm_file"
          rpm -qlp "$rpm_file" | tee /tmp/rpm-contents.txt >/dev/null
          grep -q '/usr/bin/codex-update-manager' /tmp/rpm-contents.txt
          grep -q '/opt/codex-desktop/update-builder/install.sh' /tmp/rpm-contents.txt
          mkdir -p release-assets
          cp "$rpm_file" "release-assets/codex-desktop-linux-${{ matrix.rpm_arch }}.rpm"
          (
            cd release-assets
            sha256sum "codex-desktop-linux-${{ matrix.rpm_arch }}.rpm" > "codex-desktop-linux-${{ matrix.rpm_arch }}.rpm.sha256"
          )

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-rpm-${{ matrix.release_arch }}
          path: release-assets/*

  package-pacman:
    name: Build Pacman Package (${{ matrix.pacman_arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs:
      - metadata
      - build-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_arch: x86_64
            pacman_arch: x86_64
            runner: ubuntu-24.04
          - release_arch: aarch64
            pacman_arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install package dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            libarchive-tools \
            make \
            makepkg \
            pacman-package-manager \
            zstd
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Download generated app
        uses: actions/download-artifact@v4
        with:
          name: codex-app-build-${{ matrix.release_arch }}

      - name: Extract generated app
        run: tar -I zstd -xf codex-app-${{ needs.metadata.outputs.package_version }}-${{ matrix.release_arch }}.tar.zst

      - name: Build pacman package
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
        run: |
          set -euo pipefail
          cargo build --release -p codex-update-manager
          MAX_BUILD_THREADS=4 ./scripts/build-pacman.sh
          pkg_file="$(find dist -maxdepth 1 -name 'codex-desktop-*.pkg.tar.*' ! -name '*latest*' -print -quit)"
          test -n "$pkg_file"
          bsdtar -xOf "$pkg_file" .PKGINFO | tee /tmp/pacman-info.txt
          bsdtar -tf "$pkg_file" | tee /tmp/pacman-contents.txt >/dev/null
          grep -q "usr/bin/codex-update-manager" /tmp/pacman-contents.txt
          grep -q "opt/codex-desktop/update-builder/install.sh" /tmp/pacman-contents.txt
          package_arch="$(awk -F ' = ' '$1 == "arch" { print $2; exit }' /tmp/pacman-info.txt)"
          test "$package_arch" = "${{ matrix.pacman_arch }}"
          mkdir -p release-assets
          cp "$pkg_file" "release-assets/codex-desktop-linux-${{ matrix.pacman_arch }}.pkg.tar.zst"
          (
            cd release-assets
            sha256sum "codex-desktop-linux-${{ matrix.pacman_arch }}.pkg.tar.zst" > "codex-desktop-linux-${{ matrix.pacman_arch }}.pkg.tar.zst.sha256"
          )
          rm -f dist/codex-desktop-latest.pkg.tar.zst

      - name: Upload pacman artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-pacman-${{ matrix.release_arch }}
          path: release-assets/*

  package-gentoo:
    name: Build Gentoo Overlay Package (${{ matrix.gentoo_arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs:
      - metadata
      - build-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_arch: x86_64
            gentoo_arch: amd64
            runner: ubuntu-24.04
          - release_arch: aarch64
            gentoo_arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install package dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make zstd
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Download generated app
        uses: actions/download-artifact@v4
        with:
          name: codex-app-build-${{ matrix.release_arch }}

      - name: Extract generated app
        run: tar -I zstd -xf codex-app-${{ needs.metadata.outputs.package_version }}-${{ matrix.release_arch }}.tar.zst

      - name: Build Gentoo overlay package
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
          MAX_BUILD_THREADS: "4"
        run: |
          set -euo pipefail
          cargo build --release -p codex-update-manager
          ./scripts/build-gentoo-bin.sh
          gentoo_file="$(find dist -maxdepth 1 -name 'codex-desktop-*.gentoo.tar.zst' ! -name '*latest*' -print -quit)"
          test -n "$gentoo_file"
          mkdir -p /tmp/gentoo-artifact /tmp/gentoo-payload
          tar -I zstd -xf "$gentoo_file" -C /tmp/gentoo-artifact
          test -f /tmp/gentoo-artifact/codex-desktop-linux-gentoo/install-gentoo.sh
          test -f /tmp/gentoo-artifact/codex-desktop-linux-gentoo/overlay/app-editors/codex-desktop-bin/Manifest
          test "$(cat /tmp/gentoo-artifact/codex-desktop-linux-gentoo/metadata/architecture)" = "${{ matrix.gentoo_arch }}"
          grep -q "KEYWORDS=\"${{ matrix.gentoo_arch }}\"" /tmp/gentoo-artifact/codex-desktop-linux-gentoo/overlay/app-editors/codex-desktop-bin/*.ebuild
          tar -I zstd -xf /tmp/gentoo-artifact/codex-desktop-linux-gentoo/distfiles/codex-desktop-bin-*.tar.zst -C /tmp/gentoo-payload
          test -x /tmp/gentoo-payload/image/usr/bin/codex-update-manager
          test -f /tmp/gentoo-payload/image/opt/codex-desktop/update-builder/scripts/build-gentoo-bin.sh
          test ! -e /tmp/gentoo-payload/image/usr/lib/systemd/user/codex-update-manager.service
          mkdir -p release-assets
          cp "$gentoo_file" "release-assets/codex-desktop-linux-${{ matrix.gentoo_arch }}.gentoo.tar.zst"
          (
            cd release-assets
            sha256sum "codex-desktop-linux-${{ matrix.gentoo_arch }}.gentoo.tar.zst" > "codex-desktop-linux-${{ matrix.gentoo_arch }}.gentoo.tar.zst.sha256"
          )

      - name: Upload Gentoo artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-gentoo-${{ matrix.release_arch }}
          path: release-assets/*

  package-postmarketos:
    name: Build postmarketOS APK (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    needs:
      - metadata
      - build-app
    steps:
      - uses: actions/checkout@v4

      - name: Install package dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            file \
            g++ \
            libasound2t64 \
            libatk-bridge2.0-0t64 \
            libcups2t64 \
            libgbm1 \
            libgl1-mesa-dri \
            libgtk-3-0t64 \
            libnss3 \
            make \
            musl-tools \
            patchelf \
            pax-utils \
            zstd
          docker version
          rustup toolchain install stable --profile minimal \
            --target aarch64-unknown-linux-musl
          rustup default stable

      - name: Download postmarketOS-targeted app
        uses: actions/download-artifact@v4
        with:
          name: codex-app-build-postmarketos-aarch64

      - name: Extract postmarketOS-targeted app
        run: tar -I zstd -xf codex-app-${{ needs.metadata.outputs.package_version }}-postmarketos-aarch64.tar.zst

      - name: Build musl updater and APK
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          UPDATER_BINARY_SOURCE: ${{ github.workspace }}/target/aarch64-unknown-linux-musl/release/codex-update-manager
        run: |
          set -euo pipefail
          cargo build --release --target aarch64-unknown-linux-musl -p codex-update-manager
          file "$UPDATER_BINARY_SOURCE"
          ./scripts/build-postmarketos.sh

          apk_file="$(find dist -maxdepth 1 -name 'codex-desktop-*-aarch64.apk' ! -name '*latest*' -print -quit)"
          test -n "$apk_file"
          mkdir -p /tmp/postmarketos-apk-root
          tar --ignore-zeros -xf "$apk_file" -C /tmp/postmarketos-apk-root
          tar --ignore-zeros -xOf "$apk_file" .PKGINFO | tee /tmp/postmarketos-pkginfo.txt
          grep -q '^pkgname = codex-desktop$' /tmp/postmarketos-pkginfo.txt
          grep -q '^arch = aarch64$' /tmp/postmarketos-pkginfo.txt
          test -x /tmp/postmarketos-apk-root/usr/bin/codex-update-manager
          test -x /tmp/postmarketos-apk-root/opt/codex-desktop/electron
          test -f /tmp/postmarketos-apk-root/opt/codex-desktop/.codex-linux/glibc-runtime/dri/v3d_dri.so
          test -f /tmp/postmarketos-apk-root/opt/codex-desktop/.codex-linux/glibc-runtime/lib/libX11-xcb.so.1
          test ! -e /tmp/postmarketos-apk-root/opt/codex-desktop/update-builder
          test ! -e /tmp/postmarketos-apk-root/usr/lib/systemd/user/codex-update-manager.service

          mkdir -p release-assets
          cp "$apk_file" release-assets/codex-desktop-linux-postmarketos-aarch64.apk
          (
            cd release-assets
            sha256sum codex-desktop-linux-postmarketos-aarch64.apk > codex-desktop-linux-postmarketos-aarch64.apk.sha256
          )

      - name: Smoke test private runtime under Alpine musl
        run: |
          set -euo pipefail
          docker run --rm \
            -v /tmp/postmarketos-apk-root/opt/codex-desktop:/opt/codex-desktop:ro \
            alpine:3.22 \
            /bin/sh -ec '
              apk add --no-cache util-linux xvfb-run >/dev/null
              ELECTRON_RUN_AS_NODE=1 /opt/codex-desktop/electron -e \
                "if (!process.versions.electron || process.arch !== \"arm64\") process.exit(1); console.log(process.versions.electron, process.arch, process.platform)"
              /opt/codex-desktop/resources/node-runtime/bin/node -e \
                "console.log(process.version, process.arch, process.platform)"
              ELECTRON_RUN_AS_NODE=1 /opt/codex-desktop/electron -e \
                "const binding=require(\"/opt/codex-desktop/resources/app.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node\"); if (typeof binding !== \"object\") process.exit(1)"
              set +e
              timeout -k 5 15 xvfb-run -a /opt/codex-desktop/electron \
                --ozone-platform=x11 \
                --no-sandbox \
                --disable-gpu \
                --disable-breakpad \
                --disable-features=Vulkan \
                >/tmp/electron-gui-smoke.log 2>&1
              gui_status=$?
              set -e
              case "$gui_status" in
                124|137|143) ;;
                *) cat /tmp/electron-gui-smoke.log >&2; exit "$gui_status" ;;
              esac
            '

      - name: Upload postmarketOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-postmarketos-aarch64
          path: release-assets/*

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - metadata
      - build-app
      - package-appimage
      - package-deb
      - package-rpm
      - package-pacman
      - package-gentoo
      - package-postmarketos
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
          UPSTREAM_DMG_URL: ${{ needs.metadata.outputs.upstream_dmg_url }}
        run: |
          set -euo pipefail
          {
            echo "Codex Desktop Linux release built from upstream Codex Desktop."
            echo ""
            echo "## Build Inputs"
            echo ""
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Package version: \`$PACKAGE_VERSION\`"
            echo "- Upstream DMG: \`$UPSTREAM_DMG_URL\`"
            if [ -f release-assets/upstream-dmg-metadata-x86_64.json ]; then
              echo "- Upstream DMG SHA-256: \`$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("release-assets/upstream-dmg-metadata-x86_64.json","utf8")); console.log(j.sha256)')\`"
            fi
            echo ""
            echo "## Artifacts"
            echo ""
            find release-assets -maxdepth 1 -type f \
              ! -name '*.sha256' \
              \( -name '*.AppImage' -o -name '*.apk' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.*' -o -name '*.gentoo.tar.zst' \) \
              -printf "- \`%f\`\n" | sort
            echo ""
            echo "Release asset filenames are intentionally short; exact versions stay in package metadata and \`build-info.json\`."
            echo ""
            echo "Checksums are uploaded next to each package as \`.sha256\` files."
          } > release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.metadata.outputs.release_name }}
          RELEASE_DRAFT: ${{ needs.metadata.outputs.draft }}
          RELEASE_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail

          mapfile -t files < <(find release-assets -maxdepth 1 -type f | sort)
          test "${#files[@]}" -gt 0

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_NAME" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              --draft="$RELEASE_DRAFT" \
              --prerelease="$RELEASE_PRERELEASE"
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            flags=(--title "$RELEASE_NAME" --notes-file release-notes.md --target "$GITHUB_SHA")
            if [ "$RELEASE_DRAFT" = "true" ]; then
              flags+=(--draft)
            fi
            if [ "$RELEASE_PRERELEASE" = "true" ]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${files[@]}" "${flags[@]}"
          fi

          {
            echo "## GitHub Release"
            echo ""
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- URL: $(gh release view "$RELEASE_TAG" --json url --jq .url)"
            echo "- Uploaded files: ${#files[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
